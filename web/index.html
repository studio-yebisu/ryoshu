<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5ef">
  <title>Ryoshu — 領収書OCRとAIによる勘定科目候補</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/security.js" defer></script>
  <script src="/import.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="sidebar">
      <a class="brand" href="#home" data-view="home" aria-label="Ryoshu ホーム"><img src="/icon.svg" alt="" width="34" height="34"><span>Ryoshu<small>ローカル領収書整理</small></span></a>
      <nav aria-label="メインメニュー">
        <a class="nav-item active" href="#home" data-view="home">読み込む</a>
        <a class="nav-item" href="#results" data-view="results">読み取り結果<span id="pending-count" class="nav-count">0</span></a>
        <a class="nav-item" href="#ledger" data-view="ledger">CSV出力</a>
        <details class="more-nav"><summary>その他</summary><div><a class="nav-item" href="#accounts" data-view="accounts">科目別の集計</a><a class="nav-item" href="#catalog" data-view="catalog">勘定科目一覧</a><a class="nav-item" href="#settings" data-view="settings">設定・バックアップ</a><a class="nav-item" href="/help.html" target="_blank" rel="noreferrer">使い方</a></div></details>
      </nav>
      <div class="local-status"><span class="status-dot"></span><div>このPC内で処理<small id="engine-status">エンジンを確認中</small></div></div>
    </header>
    <a class="skip-link" href="#main-workspace">本文へ移動</a>
    <main id="main-workspace" tabindex="-1">
      <header class="page-header"><div><h1 id="page-title">領収書を読み取る</h1><p id="page-description">PDFや画像をまとめて読み込み、CSVに。</p></div><button class="button" id="upload-top">ファイルを追加</button></header>
      <div id="connection-banner" class="banner hidden" role="status"></div>
      <p class="usage-guidance" id="usage-guidance">AIの読取・科目は候補です。金額・科目・用途は必ずご自身で確認し、税務上の最終判断は税理士に確認してください。<a href="/help.html#tax-review" target="_blank" rel="noreferrer">確認の方針</a></p>
      <section id="import-progress" class="panel import-progress hidden" aria-live="polite"></section>
      <section id="processing-status" class="processing-status hidden" aria-live="polite"></section>
      <section id="home-view" class="hidden"><div id="home-import"></div><div id="home-result-link" aria-live="polite"></div><p class="privacy-note">領収書の画像・内容を外部AIへ送らず、このPC内で読み取ります。</p></section>
      <div id="main-content" tabindex="-1"></div>
      <footer class="main-footer"><span>Ryoshu <span id="app-version">1.1.0</span></span><span>原本と候補を確認して、CSVへ。</span></footer>
    </main>
  </div>
  <input id="file-input" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple aria-label="領収書ファイルを選ぶ">
  <input id="folder-input" class="visually-hidden" type="file" webkitdirectory multiple aria-label="領収書のフォルダーを選ぶ">
  <dialog id="import-dialog" aria-label="領収書の取り込み"></dialog>
  <dialog id="review-dialog" aria-label="選択した明細の確認"></dialog>
  <dialog id="image-dialog" aria-label="領収書の拡大画像"></dialog>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="upload-overlay" class="upload-overlay hidden"><div>＋<strong>ここに領収書をドロップ</strong><span>JPG・PNG・WebP・PDF</span></div></div>
</body>
</html>
