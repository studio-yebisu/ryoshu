name: Local app checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: python scripts/verify_csv_workflow.py --out .local/csv-proof-ci
      - run: python scripts/check_publication.py
      - run: node --check web/app.js
      - run: node --check web/import.js
      - run: node --test tests/import-ui.test.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run test:browser
      - shell: powershell
        run: |
          foreach ($target in @('setup.ps1','start.ps1','stop.ps1','restore.ps1','scripts/launcher-process.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $target),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors) { throw ($target + ': ' + ($errors.Message -join '; ')) }
          }
      - run: node --check docs/testing/report.js
      - run: node --check docs/testing/results.js
