name: Local app checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare verified uv and Python 3.12.15
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $pwd 'scripts/bootstrap-uv.ps1')
          $uvExe = Get-RyoshuUv (Join-Path $env:RUNNER_TEMP 'ryoshu-uv-0.13.5')
          $pythonHome = Join-Path $env:RUNNER_TEMP 'ryoshu-python'
          & $uvExe python install 3.12.15 --install-dir $pythonHome
          if ($LASTEXITCODE -ne 0) { throw 'Python installation failed' }
          $managedPython = Join-Path $pythonHome 'cpython-3.12.15-windows-x86_64-none/python.exe'
          & $uvExe venv --python $managedPython .venv
          if ($LASTEXITCODE -ne 0) { throw 'Virtual environment creation failed' }
          $pythonExe = (Resolve-Path '.venv/Scripts/python.exe').Path
          & $uvExe pip install --python $pythonExe --require-hashes -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          & $uvExe pip check --python $pythonExe
          if ($LASTEXITCODE -ne 0) { throw 'Dependency check failed' }
          (Split-Path -Parent $pythonExe) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ('RYOSHU_QA_PYTHON=' + $pythonExe) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python -m pytest -q
      - run: python scripts/verify_csv_workflow.py --out .local/csv-proof-ci
      - run: python scripts/check_publication.py
      - run: node --check web/app.js
      - run: node --check web/processing.js
      - run: node --check web/import.js
      - run: node --check web/security.js
      - run: node --test tests/import-ui.test.cjs tests/account-choice.test.cjs tests/processing.test.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: node scripts/security_ui_smoke.mjs
      - run: node scripts/ux_workflow_smoke.mjs
      - run: node scripts/account_workflow_smoke.mjs
      - run: node scripts/account_favorites_smoke.mjs
      - run: node scripts/processing_workflow_smoke.mjs
      - shell: powershell
        run: |
          foreach ($target in @('setup.ps1','start.ps1','stop.ps1','restore.ps1','scripts/launcher-process.ps1','scripts/python-runtime.ps1','scripts/bootstrap-uv.ps1','packaging/windows/launch.ps1','packaging/windows/can-modify.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $target),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors) { throw ($target + ': ' + ($errors.Message -join '; ')) }
          }
      - run: node --check docs/testing/report.js
      - run: node --check docs/testing/results.js
