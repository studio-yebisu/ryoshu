name: 不具合報告
description: 架空データを使った再現情報を共有する
body:
  - type: markdown
    attributes:
      value: 実際の領収書・帳簿DB・バックアップ・復元情報・個人情報・APIキーを添付しないでください。
  - type: textarea
    id: environment
    attributes:
      label: 動作環境
      description: Windowsの版、Python、Ryoshuの版を記入してください。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順と期待する結果
      description: 架空の最小サンプルで確認できる操作順と、期待していた動作を記入してください。
    validations:
      required: true
